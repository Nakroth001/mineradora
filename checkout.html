<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Noryva</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(124,58,237,.08), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(168,85,247,.06), transparent 30%),
        #050507;
      color: white;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      overflow-x: hidden;
      position: relative;
    }

    /* CÉU ESTRELADO */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.75) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(192,132,252,.65) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.45) 1px, transparent 1.5px);
      background-size:
        140px 140px,
        190px 190px,
        240px 240px;
      background-position:
        20px 30px,
        80px 100px,
        150px 40px;
      opacity: .32;
    }

    /* BRILHOS ROXOS */
    .glow {
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(168,85,247,.10);
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      animation: glowMove 8s ease-in-out infinite alternate;
    }

    .glow.one {
      top: -100px;
      left: -100px;
    }

    .glow.two {
      bottom: -100px;
      right: -100px;
      animation-delay: 2s;
    }

    @keyframes glowMove {
      from {
        transform: translate(0,0) scale(1);
      }

      to {
        transform: translate(50px,30px) scale(1.2);
      }
    }

    /* ESTRELAS CADENTES */
    .shooting-star {
      position: fixed;
      width: 90px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(192,132,252,.15),
        rgba(216,180,254,.95)
      );
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transform: rotate(-35deg);
      animation: shooting 7s linear infinite;
    }

    .star-one {
      top: 15%;
      left: 80%;
      animation-delay: 1s;
    }

    .star-two {
      top: 38%;
      left: 65%;
      width: 70px;
      animation-delay: 3.8s;
    }

    .star-three {
      top: 65%;
      left: 90%;
      width: 80px;
      animation-delay: 5.5s;
    }

    @keyframes shooting {
      0% {
        transform: translate(0,0) rotate(-35deg);
        opacity: 0;
      }

      7% {
        opacity: .8;
      }

      20% {
        transform: translate(-380px,240px) rotate(-35deg);
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    /* CONTEÚDO */
    .checkout {
      width: 100%;
      max-width: 900px;
      position: relative;
      z-index: 10;
      display: block;
      visibility: visible

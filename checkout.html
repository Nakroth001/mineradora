<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noryva — Checkout</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 10%, rgba(120, 40, 255, .18), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(100, 30, 220, .14), transparent 30%),
        #050507;
      color: #fff;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      opacity: .6;
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%,100% { opacity: .15; }
      50% { opacity: .9; }
    }

    .checkout {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      margin: auto;
      padding: 35px 18px 25px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 25px;
    }

    .logo span {
      color: #9b5cff;
    }

    .steps {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      gap: 10px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #666;
      font-size: 13px;
      font-weight: 600;
    }

    .step.active {
      color: #fff;
    }

    .circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #17131f;
      border: 1px solid #392450;
    }

    .step.active .circle {
      background: #7c3cff;
      border-color: #9b5cff;
      box-shadow: 0 0 18px rgba(124,60,255,.45);
    }

    .line {
      width: 55px;
      height: 1px;
      background: #30243c;
    }

    .box {
      background: rgba(12, 10, 16, .94);
      border: 1px solid #291b38;
      border-radius: 20px;
      padding: 25px;
      box-shadow:
        0 20px 70px rgba(0,0,0,.45),
        0 0 35px rgba(120,40,255,.07);
    }

    .plan {
      background: #100c16;
      border: 1px solid #302040;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .plan small {
      color: #999;
      display: block;
      margin-bottom: 4px;
    }

    .plan strong {
      font-size: 18px;
    }

    .price {
      color: #b47cff;
      font-weight: 800;
      font-size: 18px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      color: #bbb;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      height: 48px;
      border-radius: 10px;
      border: 1px solid #30243c;
      background: #09080c;
      color: #fff;
      padding: 0 14px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #874cff;
      box-shadow: 0 0 0 3px rgba(135,76,255,.10);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 11px;
      margin-top: 22px;
      background: linear-gradient(135deg, #7b32ff, #a05cff);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(124,60,255,.25);
    }

    .button:hover {
      filter: brightness(1.08);
    }

    .back {
      width: 100%;
      margin-top: 12px;
      height: 45px;
      border: 1px solid #30243c;
      background: transparent;
      color: #aaa;
      border-radius: 10px;
      cursor: pointer;
    }

    .payment-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .payment-option {
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #30243c;
      background: #0b0910;
      color: #aaa;
      cursor: pointer;
      text-align: center;
      font-weight: 700;
    }

      border-color: #8b4dff;

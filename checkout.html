<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noryva — Checkout</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 10%, rgba(120,40,255,.18), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(100,30,220,.14), transparent 30%),
        #050507;
      color: #fff;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      opacity: .6;
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%,100% { opacity: .15; }
      50% { opacity: .9; }
    }

    .checkout {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      margin: auto;
      padding: 35px 18px 25px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 25px;
    }

    .logo span {
      color: #9b5cff;
    }

    .steps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #666;
      font-size: 13px;
      font-weight: 600;
    }

    .step.active {
      color: #fff;
    }

    .circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #17131f;
      border: 1px solid #392450;
    }

    .step.active .circle {
      background: #7c3cff;
      border-color: #9b5cff;
      box-shadow: 0 0 18px rgba(124,60,255,.45);
    }

    .line {
      width: 55px;
      height: 1px;
      background: #30243c;
    }

    .box {
      background: rgba(12,10,16,.96);
      border: 1px solid #291b38;
      border-radius: 20px;
      padding: 25px;
      box-shadow:
        0 20px 70px rgba(0,0,0,.45),
        0 0 35px rgba(120,40,255,.07);
    }

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Noryva</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #050507;
      color: white;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      position: relative;
      overflow-x: hidden;
    }

    /* CÉU ESTRELADO */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: .35;

      background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(192,132,252,.7) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.5) 1px, transparent 1.5px);

      background-size:
        140px 140px,
        190px 190px,
        240px 240px;

      background-position:
        20px 30px,
        80px 100px,
        150px 40px;
    }

    /* BRILHOS ROXOS */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(168, 85, 247, 0.12);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: floatGlow 7s ease-in-out infinite alternate;
    }

    body::before {
      top: -80px;
      left: -80px;
    }

    body::after {
      bottom: -100px;
      right: -80px;
      animation-delay: 2s;
    }

    @keyframes floatGlow {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(50px, 30px) scale(1.2);
      }
    }

    /* ESTRELAS CADENTES */
    .shooting-star {
      position: fixed;
      width: 90px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(192,132,252,.15),
        rgba(216,180,254,.95)
      );
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transform: rotate(-35deg);
      animation: shooting 7s linear infinite;
    }

    .star-one {
      top: 15%;
      left: 85%;
      animation-delay: 1s;
    }

    .star-two {
      top: 40%;
      left: 70%;
      width: 70px;
      animation-delay: 3.8s;
    }

    .star-three {
      top: 65%;
      left: 90%;
      width: 80px;
      animation-delay: 5.5s;
    }
